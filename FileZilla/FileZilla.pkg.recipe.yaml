Description: Downloads latest VErsion of FileZilla and creates a package
Identifier: com.github.betzerc-recipes.pkg.FileZilla
ParentRecipe: com.github.wycomco.download.FileZilla
MinimumVersion: '2.0'

Input:
  NAME: FileZilla

Process:
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: '%RECIPE_CACHE_DIR%/pkgroot'
      pkgdirs:
        Applications: '0775'

  - Processor: Copier
    Arguments:
      source_path: '%RECIPE_CACHE_DIR%/unpacked/FileZilla.app'
      destination_path: '%RECIPE_CACHE_DIR%/pkgroot/Applications/FileZilla.app'

  - Processor: Versioner
    Arguments:
      input_plist_path: '%RECIPE_CACHE_DIR%/pkgroot/Applications/FileZilla.app/Contents/Info.plist'
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        pkgname: '%NAME%-%version%-%ARCH%'
        version: '%version%'
        id: org.filezilla-project.filezilla
        options: purge_ds_store
        chown:
          - path: Applications
            user: root
            group: admin
