Description: Downloads the latest version of FileZilla and creates a package.
Identifier: com.github.betzerc-recipes.pkg.FileZilla
ParentRecipe: com.github.wycomco.download.FileZilla
MinimumVersion: "2.3"

Input:
  NAME: FileZilla

Process:
  - Processor: AppDmgVersioner
    Arguments:
     dmg_path: "%pathname%"

  - Processor: PkgRootCreator
    Arguments:
      pkgdirs:
        Applications: "0775"
        pkgroot: "%RECIPE_CACHE_DIR%/%NAME%"

  - Processor: Copier
    Arguments:
      destination_path: "%pkgroot%/Applications/%NAME%.app"
      source_path: "%pathname%/*.app"
      
  - Processor: AppPkgCreator
    Arguments:
      pkg_request:
        chown:
          - group: admin
            path: Applications
            user: root
      app_path: "%RECIPE_CACHE_DIR%/%NAME%/*.app"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%-arm64.pkg"
