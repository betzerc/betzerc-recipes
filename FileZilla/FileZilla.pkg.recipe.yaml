Description: Downloads the latest version of FileZilla and creates a package.
Identifier: com.github.betzerc-recipes.pkg.FileZilla
ParentRecipe: com.github.wycomco.download.FileZilla
MinimumVersion: "2.3"

Input: 
  NAME: FileZilla

Process: 
  - Processor: AppDmgVersioner
    Arguments:
      dmg_path: "%pathname%"

  - Processor: AppPkgCreator
    Arguments:
      app_path: "%pathname%/*.app"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      pkg_request:
        bundleid: "org.filezilla-project.filezilla"
        chown:
          - group: admin
            path: Applications
            user: root
        id: "org.filezilla-project.filezilla.pkg"
        options: purge_ds_store
        pkgname: "%NAME%-%version%"
